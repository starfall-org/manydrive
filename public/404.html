<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found · ManyDrive</title>
    <style>
        :root {
            --bg: #0b1020;
            --accent: #4f8cff;
            --accent-2: #6ee7b7;
            --text: #e8ecf8;
            --muted: #9aa5c0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(1200px 600px at 80% -10%, #1c2a5a 0%, var(--bg) 55%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            line-height: 1.6;
        }

        .card { max-width: 460px; }
        .code {
            font-size: 96px; font-weight: 800; letter-spacing: -2px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        h1 { font-size: 26px; margin-bottom: 12px; }
        p { color: var(--muted); margin-bottom: 28px; }

        .logo {
            display: inline-flex; align-items: center; gap: 10px; margin-bottom: 24px;
            font-weight: 700; font-size: 18px;
        }
        .logo .mark {
            width: 34px; height: 34px; border-radius: 9px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex; align-items: center; justify-content: center;
            color: #0b1020; font-weight: 800;
        }

        .btn {
            display: inline-block; padding: 12px 26px; border-radius: 12px;
            background: linear-gradient(90deg, var(--accent), #3f6fe0);
            color: #fff; text-decoration: none; font-weight: 600;
            box-shadow: 0 8px 24px rgba(79,140,255,0.35);
            transition: transform .15s ease;
        }
        .btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <div class="mark">M</div>
            <span>ManyDrive</span>
        </div>
        <div class="code">404</div>
        <h1>Page Not Found</h1>
        <p>The page you are looking for doesn't exist or has been moved. Check the URL for mistakes and try again.</p>
        <a class="btn" href="./">Back to Home</a>
    </div>
</body>
</html>
