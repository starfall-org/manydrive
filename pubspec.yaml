name: manydrive
description: "ManyDrive is a file manager for Google Drive."
publish_to: "none"

version: 2.3.11+11

environment:
  sdk: ^3.7.0-209.1.beta

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.3.0
  googleapis: ^14.0.0
  googleapis_auth: ^2.0.0
  google_sign_in: ^6.2.2
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  dynamic_color: ^1.7.0
  path_provider: ^2.1.5
  file_picker: ^10.0.0
  permission_handler: ^11.4.0
  shared_preferences: ^2.5.3
  flutter_launcher_icons: ^0.14.3
  audioplayers: ^6.4.0
  url_launcher: ^6.3.1
  chewie: ^1.11.1
  video_player: ^2.9.5
  flutter_local_notifications: ^19.5.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  crypto: ^3.0.6
  wakelock_plus: ^1.2.8
  minio: ^3.5.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/background.png
    - assets/icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#000000"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon.png"
